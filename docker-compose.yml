version: '3.8'

services:
  # Main Application
  app:
    build: .
    ports:
      - "5000:5000"
      - "3000:3000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=5000
      - FRONTEND_HOST=0.0.0.0
      - FRONTEND_PORT=3000
      - OLLAMA_HOST=http://ollama:11434
      - PIPER_HOST=tts
      - PIPER_PORT=8000
      - STORAGE_PATH=/app/storage
      - TEMP_PATH=/app/temp
    volumes:
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./logs:/app/logs
    depends_on:
      - ollama
      - tts
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Piper TTS Service
  tts:
    image: rhasspy/piper:latest
    ports:
      - "8000:8000"
    volumes:
      - piper_voices:/root/.local/share/piper
    environment:
      - PIPER_VOICE=en_US-lessac-medium
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ollama_data:
  piper_voices:

networks:
  ai-network:
    driver: bridge
